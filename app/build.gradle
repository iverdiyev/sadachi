plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.svoizadachi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.svoizadachi.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
