plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.svoizadachi.app'
    compileSdk 35

    defaultConfig {
        applicationId (project.findProperty('sadachiApplicationId') ?: 'com.ilkinsadachi')
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.8.0'
        manifestPlaceholders = [migrationAuthority: "${applicationId}.migration", appLabel: (applicationId == 'com.ilkinsadachi' ? 'Sadachi' : 'Sadachi · перенос')]
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // CI uses a persistent repository secret, never an implicitly generated key.
    signingConfigs {
        debug {
            def signingPath = System.getenv('SADACHI_KEYSTORE_PATH')
            if (signingPath) {
                storeFile file(signingPath)
                storeType 'PKCS12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}


dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}

tasks.withType(Test).configureEach {
    // Screenshots are deliberately not generated for this UI revision.
    exclude '**/ScreenshotsTest.class'
}
