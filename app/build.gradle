plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.svoizadachi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.svoizadachi.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // CI uses a persistent repository secret, never an implicitly generated key.
    signingConfigs {
        debug {
            def signingPath = System.getenv('SADACHI_KEYSTORE_PATH')
            if (signingPath) {
                storeFile file(signingPath)
                storeType 'PKCS12'
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
