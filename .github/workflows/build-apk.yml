name: Собрать APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SADACHI_KEYSTORE_PATH: ${{ github.workspace }}/.signing/debug.keystore
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Восстановить постоянный ключ тестовой подписи
        env:
          SIGNING_KEY: ${{ secrets.SADACHI_SIGNING_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          mkdir -p "$(dirname "$SADACHI_KEYSTORE_PATH")"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$SADACHI_KEYSTORE_PATH"
      - name: Проверить парсер
        run: |
          mkdir -p parser-tests
          javac -encoding UTF-8 -d parser-tests app/src/main/java/ru/svoizadachi/app/TaskDateParser.java tests/ParserTest.java
          java -cp parser-tests ParserTest
      - name: Тесты и сборка APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --no-build-cache
      - name: Проверить постоянную подпись APK
        run: |
          keytool -exportcert -keystore "$SADACHI_KEYSTORE_PATH" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/sadachi-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/sadachi-cert.der" | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$expected" = "$actual"
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Sadachi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Опубликовать APK и сведения об обновлении
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/publish-release.py
