name: Собрать APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Установить Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Проверить парсер
        run: |
          mkdir -p parser-tests
          javac -encoding UTF-8 -d parser-tests app/src/main/java/ru/svoizadachi/app/TaskDateParser.java tests/ParserTest.java
          java -cp parser-tests ParserTest
      - name: Тесты и сборка APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Sadachi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
